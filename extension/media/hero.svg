<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title description" font-family="DejaVu Sans">
  <title id="title">Agent CodeWalk product preview</title>
  <desc id="description">A dark editor window with an upload retry function highlighted in the source editor and a guided Agent CodeWalk dependency graph in the sidebar.</desc>
  <defs>
    <linearGradient id="background" x1="70" y1="30" x2="1320" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17213a"/>
      <stop offset="0.48" stop-color="#101522"/>
      <stop offset="1" stop-color="#122a35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#70d6ff"/>
      <stop offset="1" stop-color="#3da6ff"/>
    </linearGradient>
    <linearGradient id="selection" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#173f49"/>
      <stop offset="1" stop-color="#173f49" stop-opacity="0.28"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#02050b" flood-opacity="0.55"/>
    </filter>
    <style>
      .ui { font-family: "DejaVu Sans"; }
      .code { font-family: "DejaVu Sans Mono"; }
      .muted { fill: #8993a5; }
      .soft { fill: #b4bdcb; }
      .bright { fill: #e7edf6; }
      .line { stroke: #2b3444; }
    </style>
  </defs>

  <rect width="1400" height="800" rx="28" fill="url(#background)"/>
  <circle cx="1260" cy="86" r="180" fill="#235d76" opacity="0.2"/>
  <circle cx="116" cy="710" r="230" fill="#363d85" opacity="0.18"/>
  <path d="M100 126C290 42 443 54 586 102" fill="none" stroke="#6ccffc" stroke-opacity="0.1" stroke-width="2"/>
  <path d="M868 738c160 42 330 10 442-78" fill="none" stroke="#68f0c3" stroke-opacity="0.1" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="62" y="54" width="1276" height="690" rx="18" fill="#121722" stroke="#364053"/>
    <path d="M62 72a18 18 0 0 1 18-18h1240a18 18 0 0 1 18 18v40H62Z" fill="#1d2431"/>
    <circle cx="91" cy="83" r="6" fill="#ff6b6b"/>
    <circle cx="111" cy="83" r="6" fill="#ffd166"/>
    <circle cx="131" cy="83" r="6" fill="#5bd6a2"/>
    <text x="700" y="89" text-anchor="middle" class="ui soft" font-size="13">upload-service — Agent CodeWalk</text>

    <rect x="62" y="112" width="54" height="632" fill="#181e29"/>
    <g transform="translate(75 133)">
      <rect width="28" height="28" rx="7" fill="#283142"/>
      <path d="M7 8h10M7 14h14M7 20h8" fill="none" stroke="#8490a4" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g transform="translate(75 177)">
      <rect width="28" height="28" rx="7" fill="#283142"/>
      <path d="M8 8h6l3 3h5v10H8Z" fill="none" stroke="#8490a4" stroke-width="1.7" stroke-linejoin="round"/>
    </g>
    <g transform="translate(75 221)">
      <rect width="28" height="28" rx="7" fill="#263c52" stroke="#51bfff"/>
      <g transform="translate(2 2)" fill="#dce7f5" stroke="#dce7f5">
        <path d="m10 3.75-4.75 3.75v9L10 20.25M14 3.75l4.75 3.75v9L14 20.25" fill="none" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M9 6.5V9l3 3v2.5l4 3" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="9" cy="6.5" r="1.45" stroke="none"/>
        <circle cx="12" cy="12" r="1.45" stroke="none"/>
        <circle cx="16" cy="17.5" r="1.45" stroke="none"/>
      </g>
    </g>

    <rect x="116" y="112" width="208" height="632" fill="#151b26"/>
    <text x="136" y="143" class="ui muted" font-size="11" font-weight="700" letter-spacing="1.2">EXPLORER</text>
    <text x="136" y="176" class="ui bright" font-size="13" font-weight="600">⌄  UPLOAD-SERVICE</text>
    <text x="151" y="207" class="ui soft" font-size="13">⌄  src</text>
    <rect x="128" y="218" width="184" height="28" rx="4" fill="#253044"/>
    <text x="172" y="237" class="ui bright" font-size="13">upload.ts</text>
    <text x="151" y="271" class="ui soft" font-size="13">⌄  test</text>
    <text x="172" y="300" class="ui soft" font-size="13">upload.test.ts</text>
    <text x="151" y="333" class="ui soft" font-size="13">›  docs</text>
    <text x="151" y="366" class="ui soft" font-size="13">package.json</text>
    <text x="151" y="399" class="ui soft" font-size="13">README.md</text>

    <rect x="324" y="112" width="636" height="632" fill="#0f141e"/>
    <rect x="324" y="112" width="636" height="42" fill="#171d28"/>
    <path d="M350 112h128l13 42H350Z" fill="#0f141e"/>
    <text x="371" y="138" class="ui bright" font-size="13">upload.ts</text>
    <circle cx="470" cy="132" r="3" fill="#f3c96b"/>
    <line x1="324" y1="154" x2="960" y2="154" class="line"/>

    <text x="348" y="187" class="code" font-size="11" fill="#5cb9f2">Agent CodeWalk · 2/4 · Retry transient uploads</text>
    <text x="350" y="224" class="code muted" font-size="13" text-anchor="end">18</text>
    <text x="350" y="250" class="code muted" font-size="13" text-anchor="end">19</text>
    <text x="350" y="276" class="code muted" font-size="13" text-anchor="end">20</text>
    <text x="350" y="302" class="code muted" font-size="13" text-anchor="end">21</text>
    <text x="350" y="328" class="code muted" font-size="13" text-anchor="end">22</text>
    <text x="350" y="354" class="code muted" font-size="13" text-anchor="end">23</text>
    <text x="350" y="380" class="code muted" font-size="13" text-anchor="end">24</text>
    <text x="350" y="406" class="code muted" font-size="13" text-anchor="end">25</text>
    <text x="350" y="432" class="code muted" font-size="13" text-anchor="end">26</text>
    <text x="350" y="458" class="code muted" font-size="13" text-anchor="end">27</text>
    <text x="350" y="484" class="code muted" font-size="13" text-anchor="end">28</text>
    <text x="350" y="510" class="code muted" font-size="13" text-anchor="end">29</text>

    <rect x="364" y="232" width="584" height="258" fill="url(#selection)"/>
    <rect x="364" y="232" width="3" height="258" rx="1.5" fill="#55d7a3"/>
    <g class="code" font-size="14" fill="#c8d2df">
      <text x="379" y="224" fill="#c792ea">export async function uploadWithRetry(file: File) {</text>
      <text x="395" y="250">const policy = retryPolicy(3);</text>
      <text x="395" y="276" fill="#c792ea">for await (const attempt of policy) {</text>
      <text x="411" y="302" fill="#c792ea">try {</text>
      <text x="427" y="328" fill="#82aaff">return await storage.put(file);</text>
      <text x="411" y="354" fill="#c792ea">} catch (error) {</text>
      <text x="427" y="380">if (!isTransient(error)) throw error;</text>
      <text x="427" y="406" fill="#82aaff">await attempt.backoff();</text>
      <text x="411" y="432">}</text>
      <text x="395" y="458">}</text>
      <text x="395" y="484" fill="#c3e88d">throw new UploadError("retry limit reached");</text>
      <text x="379" y="510">}</text>
    </g>
    <rect x="364" y="541" width="584" height="1" fill="#273142"/>
    <text x="379" y="576" class="code muted" font-size="13">// Non-transient errors still fail immediately.</text>
    <text x="379" y="610" class="code" font-size="14" fill="#c792ea">function isTransient(error: unknown): boolean {</text>
    <text x="395" y="636" class="code" font-size="14" fill="#82aaff">return error instanceof NetworkError;</text>
    <text x="379" y="662" class="code" font-size="14" fill="#c8d2df">}</text>

    <rect x="960" y="112" width="378" height="632" fill="#171d28"/>
    <line x1="960" y1="112" x2="960" y2="744" class="line"/>
    <g class="ui">
      <text x="984" y="143" class="bright" font-size="15" font-weight="650">Add safe upload retries</text>
      <rect x="1211" y="128" width="86" height="22" rx="11" fill="#223d50" stroke="#58bff4" stroke-opacity="0.6"/>
      <text x="1254" y="143" text-anchor="middle" fill="#7fd5ff" font-size="10" font-weight="700" letter-spacing="0.7">CHANGE</text>

      <rect x="984" y="165" width="276" height="4" rx="2" fill="#2d3747"/>
      <rect x="984" y="165" width="138" height="4" rx="2" fill="url(#accent)"/>
      <text x="1271" y="172" class="muted" font-size="11">2 / 4</text>

      <rect x="984" y="190" width="150" height="34" rx="6" fill="#242c3a" stroke="#343f51"/>
      <text x="1059" y="212" text-anchor="middle" class="soft" font-size="12">← Previous</text>
      <rect x="1142" y="190" width="152" height="34" rx="6" fill="#1874a9"/>
      <text x="1218" y="212" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">Next →</text>

      <rect x="984" y="238" width="310" height="31" rx="6" fill="#111722" stroke="#343f51"/>
      <rect x="1139" y="238" width="155" height="31" rx="6" fill="#1874a9"/>
      <text x="1061" y="258" text-anchor="middle" class="muted" font-size="11">By file</text>
      <text x="1217" y="258" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Graph</text>

      <rect x="984" y="288" width="310" height="176" rx="8" fill="#121925" stroke="#364153"/>
      <rect x="1000" y="305" width="65" height="20" rx="10" fill="#183d35" stroke="#55d7a3" stroke-opacity="0.6"/>
      <text x="1032" y="319" text-anchor="middle" fill="#6ce0b0" font-size="9" font-weight="700" letter-spacing="0.5">MODIFIED</text>
      <text x="1277" y="319" text-anchor="end" class="muted" font-size="10">Step 2 of 4</text>
      <text x="1000" y="348" class="bright" font-size="14" font-weight="650">Retry transient uploads</text>
      <text x="1000" y="370" fill="#67c9ff" font-size="10">src/upload.ts:18</text>
      <text x="1000" y="398" class="soft" font-size="11.5">Retry only network failures, then stop after</text>
      <text x="1000" y="416" class="soft" font-size="11.5">three attempts. Permanent errors still surface</text>
      <text x="1000" y="434" class="soft" font-size="11.5">immediately to the caller.</text>
      <rect x="1000" y="443" width="115" height="28" rx="5" fill="#242c3a" stroke="#364153"/>
      <text x="1057" y="461" text-anchor="middle" class="soft" font-size="10">Compare with before</text>

      <text x="984" y="500" class="muted" font-size="10" font-weight="700" letter-spacing="1">ALL STEPS</text>
      <text x="984" y="523" class="muted" font-size="10">Dependencies connect each step to what uses it.</text>

      <path d="M1004 554v126M1004 554h14M1004 596h14M1004 638h14M1004 680h14" fill="none" stroke="#4a5a70" stroke-width="1.5"/>
      <circle cx="1004" cy="554" r="4" fill="#171d28" stroke="#8b98ab" stroke-width="1.5"/>
      <circle cx="1004" cy="596" r="5" fill="#171d28" stroke="#58c8ff" stroke-width="2"/>
      <circle cx="1004" cy="638" r="4" fill="#171d28" stroke="#8b98ab" stroke-width="1.5"/>
      <circle cx="1004" cy="680" r="4" fill="#171d28" stroke="#8b98ab" stroke-width="1.5"/>

      <text x="1025" y="558" class="soft" font-size="11.5">1  Define the retry policy</text>
      <rect x="1018" y="574" width="276" height="42" rx="5" fill="#203044"/>
      <text x="1025" y="600" class="bright" font-size="11.5" font-weight="600">2  Retry transient uploads</text>
      <text x="1025" y="642" class="soft" font-size="11.5">3  Preserve permanent failures</text>
      <text x="1025" y="684" class="soft" font-size="11.5">4  Cover backoff and limits</text>
    </g>

    <rect x="62" y="718" width="1276" height="26" rx="0 0 18 18" fill="#156f9f"/>
    <text x="82" y="736" class="ui" font-size="11" fill="#ffffff">feat/retry-upload</text>
    <text x="1128" y="736" class="ui" font-size="11" fill="#ffffff">CodeWalk 2/4</text>
    <text x="1307" y="736" text-anchor="end" class="ui" font-size="11" fill="#ffffff">TypeScript</text>
  </g>
</svg>
