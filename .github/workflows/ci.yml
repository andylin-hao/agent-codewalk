name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Verify the version is single-sourced
        run: node scripts/sync-version.mjs --check
      - run: corepack pnpm --filter agent-codewalk check
      - run: corepack pnpm --filter agent-codewalk test
      - run: corepack pnpm audit --prod --audit-level high
      - run: corepack pnpm --filter agent-codewalk build
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libgbm1 libasound2t64
      - run: xvfb-run -a corepack pnpm --filter agent-codewalk test:extension

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release

  rust-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      # The floor starts conservative because it was introduced without a recorded
      # baseline. Raise it to just under the first reported figure.
      - name: Measure companion coverage
        run: cargo llvm-cov --workspace --summary-only --fail-under-lines 80

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
