name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: windows-2022
            target: win32-x64
          - os: macos-13
            target: darwin-x64
          - os: macos-14
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Verify the version is single-sourced
        run: node scripts/sync-version.mjs --check
      - run: cargo build --release --locked
      - name: Build platform VSIX
        shell: bash
        run: |
          cd extension
          corepack pnpm build
          node scripts/stage-companion.mjs
          corepack pnpm exec vsce package --no-dependencies --target "${{ matrix.target }}" --out "agent-codewalk-${{ matrix.target }}.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-codewalk-${{ matrix.target }}
          path: extension/agent-codewalk-${{ matrix.target }}.vsix
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        run: sha256sum artifacts/*.vsix > artifacts/SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/*.vsix
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*

  marketplace:
    needs: package
    runs-on: ubuntu-latest
    # Forks can build release artifacts, but only the canonical repository publishes the
    # official extension. Missing credentials there are a failed release, not a silent
    # registry skip.
    if: ${{ github.repository_owner == 'andylin-hao' }}
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: corepack enable
      - name: Require both registry credentials
        shell: bash
        run: |
          if [[ -z "$VSCE_PAT" || -z "$OVSX_PAT" ]]; then
            echo "VSCE_PAT and OVSX_PAT are both required for an official release." >&2
            exit 1
          fi
      - name: Publish to the VS Code Marketplace
        run: corepack pnpm dlx @vscode/vsce publish --packagePath artifacts/*.vsix
      - name: Publish to Open VSX
        shell: bash
        run: |
          for package in artifacts/*.vsix; do
            corepack pnpm dlx ovsx publish "$package"
          done
